services:
  frontend:
    container_name: team2-front-app
    build:
      context: .
      args:
        PORT: ${PORT:-3001}
        API_BASE_URL: ${API_CONTAINER_URL:-http://team2-back-app:3000}
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    networks:
      - team2-network

networks:
  team2-network:
    external: true
