name: CI Pipeline

on:
  pull_request:
    branches:
        - main
  push:
    branches: 
        - "**"

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Run Biome Linting
          run: npm run lint

        - name: Run Biome Formatting Check
          run: npm run format:check

    accessibility:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Run Accessibility Tests
          run: npm run test:pa11y:local

    build:
        needs: [code-quality, accessibility]
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Build Application
          run: npm run build

    docker-build:
        needs: build
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t team2-front-app-pipeline:latest .

        - name: Login to Azure Container Registry
          
          uses: azure/docker-login@v1
          with:
            login-server: ${{ secrets.ACR_LOGIN_SERVER }}
            username: ${{ secrets.ACR_USERNAME }}
            password: ${{ secrets.ACR_PASSWORD }}

        - name: Tag Docker image
          
          run: |
            docker tag team2-front-app-pipeline:latest ${{ secrets.ACR_LOGIN_SERVER }}/team2-front-app-pipeline:latest
            docker tag team2-front-app-pipeline:latest ${{ secrets.ACR_LOGIN_SERVER }}/team2-front-app-pipeline:${{ github.sha }}

        - name: Push Docker image
          
          run: |
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/team2-front-app-pipeline:latest
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/team2-front-app-pipeline:${{ github.sha }}